# Chạy cả backend + frontend từ thư mục root:
#   docker compose up -d --build
#   docker compose --profile local up -d --build   (kèm MySQL container)
# Muốn chạy riêng từng phần: vào backend/ hoặc frontend/ rồi `docker compose up -d --build`.
include:
  - backend/docker-compose.yml

services:
  frontend:
    extends:
      file: frontend/docker-compose.yml
      service: frontend
    depends_on:
      - backend
