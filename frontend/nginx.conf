server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ${BACKEND_URL} lấy từ frontend/.env, được điền vào lúc container khởi động.
    # Phân giải tên miền lúc có request (DNS của Docker), để nginx vẫn
    # khởi động được khi backend chạy bằng docker compose riêng và chưa lên.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream ${BACKEND_URL};

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
