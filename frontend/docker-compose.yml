# Chạy riêng frontend (trong thư mục frontend/):
#   docker compose up -d --build
# Chạy trước hay sau backend đều được: cả hai cùng dùng network todo_net.
# nginx proxy /api sang BACKEND_URL trong .env (mặc định backend:8000).
services:
  frontend:
    build: .
    container_name: todo_frontend
    restart: unless-stopped
    # BACKEND_URL trong .env được truyền vào nginx lúc chạy.
    env_file: .env
    ports:
      - "3000:80"

# Network chung với backend (compose riêng), ai chạy trước thì tạo.
networks:
  default:
    name: todo_net
