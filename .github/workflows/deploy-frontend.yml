# CI/CD frontend: push code trong frontend/ lên nhánh main
#   -> build Docker image -> push lên ECR -> tạo revision task definition mới -> cập nhật ECS service.
# Cần cấu hình trong GitHub repo (Settings -> Secrets and variables -> Actions):
#   Secrets  : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: ECS_CLUSTER, ECS_SERVICE_FRONTEND
#   (tuỳ chọn) ECR_REPOSITORY_FRONTEND (mặc định todo-frontend), CONTAINER_NAME_FRONTEND (mặc định container đầu tiên)
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: # cho phép bấm chạy tay ở tab Actions

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_FRONTEND || 'todo-frontend' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE_FRONTEND }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME_FRONTEND }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra biến cấu hình
        run: |
          if [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_SERVICE" ]; then
            echo "::error::Thiếu Variables ECS_CLUSTER hoặc ECS_SERVICE_FRONTEND trong Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Đăng nhập AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Đăng nhập Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build và push image lên ECR
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          # Tag theo commit SHA: mỗi lần deploy là 1 image riêng, ECS chắc chắn dùng bản mới.
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" ./frontend
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      - name: Tải task definition service đang dùng
        id: taskdef
        run: |
          # Lấy đúng task definition mà service đang chạy (giữ nguyên env, port, role...), chỉ thay image.
          TD_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ -z "$TD_ARN" ] || [ "$TD_ARN" = "None" ]; then
            echo "::error::Không tìm thấy service $ECS_SERVICE trong cluster $ECS_CLUSTER"; exit 1
          fi
          echo "Task definition hiện tại: $TD_ARN"
          aws ecs describe-task-definition --task-definition "$TD_ARN" \
            --query taskDefinition > task-definition.json
          # Tên container: lấy từ Variables nếu có, không thì lấy container đầu tiên trong task definition.
          NAME="${CONTAINER_NAME:-$(jq -r '.containerDefinitions[0].name' task-definition.json)}"
          echo "Container: $NAME"
          echo "container=$NAME" >> "$GITHUB_OUTPUT"

      - name: Gắn image mới vào task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.taskdef.outputs.container }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy lên ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15