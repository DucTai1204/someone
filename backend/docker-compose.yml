# Chạy riêng backend (trong thư mục backend/):
#   docker compose up -d --build                  -> dùng DB trong .env (vd. RDS)
#   docker compose --profile local up -d --build  -> chạy kèm MySQL container (DB_HOST=db trong .env)
services:
  backend:
    build: .
    container_name: todo_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
# Network chung để frontend (compose riêng) gọi được backend:8000.
networks:
  default:
    name: todo_net


